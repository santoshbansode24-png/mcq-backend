    <!-- Register PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('service-worker.js').then(function(registration) {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
            
            // Periodically check for service worker updates on the server
            setInterval(() => {
              registration.update();
            }, 60000); // Check every 60 seconds

            // Check for updates on load
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New update fully installed. Ask the worker to take over immediately.
                  console.log('New update available. Activating new version...');
                  newWorker.postMessage('skipWaiting');
                }
              });
            });
          }, function(err) {
            console.log('ServiceWorker registration failed: ', err);
          });
        });

        // Trigger reload when the new service worker officially takes control
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            console.log('New service worker active. Reloading page...');
            window.location.reload();
          }
        });
      }
    </script>
