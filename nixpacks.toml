[variables]
NIXPACKS_PHP_VERSION = '8.2.27'

[phases.install]
cmds = ["mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx", "rm -f composer.lock", "composer update --no-interaction --ignore-platform-reqs"]

[phases.build]
cmds = ["composer update --no-interaction --prefer-dist --optimize-autoloader"]
